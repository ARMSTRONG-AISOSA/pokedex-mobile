<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Dexplorer</title>
  <!-- GitHub Pages shows this for any missing address under /pokedex-mobile/, so links are absolute. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#13222b">
  <link rel="icon" href="/pokedex-mobile/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pokedex-mobile/styles.css">
</head>
<body>
  <main class="hero notfound">
    <div class="wrap notfound-inner">
      <img src="/pokedex-mobile/assets/favicon.svg" width="72" height="72" alt="">
      <p class="eyebrow">Error 404</p>
      <h1>This page got away.</h1>
      <p class="lede">The address may be mistyped, or the page has moved. The Pokédex is still right where you left it.</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="/pokedex-mobile/">Back to Dexplorer</a>
      </div>
    </div>
  </main>
</body>
</html>
