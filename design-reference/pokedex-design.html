<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex design draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #13222b;
    --muted: #55666e;
    --line: #d3dfdc;
    --rule: #94a9a9;
    --frame: #cbd8d5;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1618; --surface: #162226; --ink: #e8f1f0; --muted: #94a7ac;
      --line: #263a3f; --rule: #4a666b; --frame: #070c0d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1618; --surface: #162226; --ink: #e8f1f0; --muted: #94a7ac;
    --line: #263a3f; --rule: #4a666b; --frame: #070c0d;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* Phone frame (only visible on wide screens) */
  .device { position: relative; width: 100%; max-width: 420px; height: 100%; margin: 0 auto; overflow: hidden; background: var(--bg); }
  @media (min-width: 520px) {
    body { background: var(--frame); display: grid; place-items: center; padding: 24px; }
    .device { height: min(860px, 100%); border-radius: 38px; border: 8px solid var(--ink); box-shadow: 0 30px 60px rgba(0,0,0,.25); }
  }

  .scroll { position: absolute; inset: 0 0 64px 0; overflow-y: auto; overscroll-behavior: contain; }

  /* ---------- List screen ---------- */
  .top { padding: 22px 20px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: -0.03em; line-height: 1; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--field); border: 1px solid var(--line); }
  .icon-btn svg { width: 22px; height: 22px; }

  .search { margin: 16px 20px 0; position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--muted); }
  .search input { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); padding: 0 14px 0 44px; }
  .search input::placeholder { color: var(--muted); }

  .chips { display: flex; gap: 8px; padding: 14px 20px 4px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; background: var(--field); border: 1px solid var(--line); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--t, var(--ink)); }
  .chip[aria-pressed="true"] { background: var(--td, var(--ink)); color: #fff; border-color: transparent; }
  .chip[aria-pressed="true"] i { background: #fff; }
  .chip[data-all][aria-pressed="true"] { background: #13222b; color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[data-all][aria-pressed="true"] { background: #3b5a64; } }
  :root[data-theme="dark"] .chip[data-all][aria-pressed="true"] { background: #3b5a64; }

  .count { margin: 12px 20px 8px; color: var(--muted); font-size: 13.5px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 24px; }
  .card {
    position: relative; text-align: left; border-radius: 22px; padding: 14px 14px 14px;
    background: color-mix(in srgb, var(--t) 16%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--t) 30%, var(--line));
    display: flex; flex-direction: column; gap: 6px; min-height: 176px;
    transition: transform .15s ease;
  }
  .card:active { transform: scale(.97); }
  .card .num { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
  .card .art { align-self: center; margin: 2px 0 4px; }
  .card h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .card .fav { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; color: #d63a5c; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--t) 24%, var(--surface)); color: var(--ink); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--t); }

  .empty { margin: 40px 28px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 20px; margin-bottom: 6px; }

  /* ---------- Tab bar ---------- */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--surface); border-top: 1px solid var(--line); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab-ind { position: absolute; top: -1px; left: 0; width: 33.3333%; height: 3px; display: flex; justify-content: center; transition: transform .38s cubic-bezier(.22,1,.36,1); pointer-events: none; }
  .tab-ind::before { content: ""; width: 36px; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
  .tab svg { transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
  .tab[aria-current="page"] svg { transform: translateY(-2px) scale(1.1); }

  /* ---------- Detail screen ---------- */
  .detail { position: absolute; inset: 0; background: var(--bg); transform: translateX(100%); transition: transform .34s cubic-bezier(.22,1,.36,1), visibility 0s .34s; visibility: hidden; box-shadow: -12px 0 30px rgba(0,0,0,.12); overflow-y: auto; overscroll-behavior: contain; }
  .detail.open { transform: none; visibility: visible; transition: transform .34s cubic-bezier(.22,1,.36,1), visibility 0s; }
  .hero { position: relative; background: var(--td); color: #fff; padding: 18px 20px 96px; overflow: hidden; }
  .hero .bar { display: flex; justify-content: space-between; position: relative; z-index: 2; }
  .hero .icon-btn { background: rgba(255,255,255,.16); border-color: transparent; color: #fff; }
  .hero .icon-btn[aria-pressed="true"] svg { fill: #fff; }
  .hero .ring { position: absolute; right: -70px; top: 30px; width: 280px; height: 280px; opacity: .16; }
  .hero h2 { position: relative; z-index: 2; margin: 22px 0 10px; font-family: var(--display); font-weight: 800; font-size: 46px; line-height: .95; letter-spacing: -0.035em; }
  .hero .dexnum { position: relative; z-index: 2; font-size: 14px; opacity: .85; font-variant-numeric: tabular-nums; }
  .hero .pill { background: rgba(255,255,255,.2); color: #fff; }
  .hero .pill i { background: #fff; }
  .hero .big-art { position: absolute; right: 18px; bottom: 28px; z-index: 2; filter: drop-shadow(0 10px 14px rgba(0,0,0,.25)); }

  .sheet { position: relative; margin-top: -40px; background: var(--bg); border-radius: 32px 32px 0 0; padding: 26px 20px 40px; }
  .sheet h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
  .sheet .note { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .sheet section + section { margin-top: 30px; }

  .stats { display: grid; gap: 11px; margin: 14px 0 0; padding: 0; list-style: none; }
  .stat { display: grid; grid-template-columns: 62px 34px 1fr; align-items: center; gap: 10px; font-size: 14px; }
  .stat span:first-child { color: var(--muted); }
  .stat b { font-variant-numeric: tabular-nums; text-align: right; }
  .track { height: 9px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 5px; background: var(--t); transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .total { margin-top: 14px; display: flex; justify-content: space-between; font-size: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .total b { font-variant-numeric: tabular-nums; }

  /* ---------- Evolution tree ---------- */
  .evo-wrap { overflow-x: auto; padding: 6px 0 8px; margin: 0 -20px; padding-inline: 20px; }
  .evo-row { display: flex; align-items: center; }
  .evo-node { flex: none; width: 70px; min-height: 92px; padding: 8px 4px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
  .evo-node span { font-family: var(--display); font-weight: 700; font-size: 12.5px; line-height: 1.1; overflow-wrap: anywhere; }
  .evo-node small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .evo-node.is-current { background: color-mix(in srgb, var(--t) 20%, var(--surface)); border: 2px solid var(--td); }
  .evo-kids { position: relative; display: flex; flex-direction: column; }
  .evo-kids.multi::before { content: ""; position: absolute; left: 0; top: 46px; bottom: 46px; width: 2px; background: var(--rule); }
  .evo-kid { display: flex; align-items: center; min-height: 92px; }
  .evo-edge { position: relative; flex: none; width: 66px; align-self: stretch; }
  .evo-edge::after { content: ""; position: absolute; left: 0; right: 5px; top: 50%; height: 2px; margin-top: -1px; background: var(--rule); }
  .evo-edge::before { content: ""; position: absolute; right: 0; top: 50%; margin-top: -5px; border-left: 7px solid var(--rule); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .evo-edge span { position: absolute; left: 4px; right: 8px; bottom: calc(50% + 5px); text-align: center; font-size: 10.5px; line-height: 1.15; color: var(--muted); }

  :root { --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bad: #ff9a90; } }
  :root[data-theme="dark"] { --bad: #ff9a90; }

  /* Fields and buttons: soft tint on white in light mode, the card surface in dark mode */
  :root { --field: #e9f0ee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --field: #162226; } }
  :root[data-theme="dark"] { --field: #162226; }

  /* ---------- Detail: team button ---------- */
  .team-btn { display: block; width: 100%; height: 50px; border-radius: 16px; background: var(--td); color: #fff; font-weight: 600; margin-bottom: 26px; }
  .team-btn.on { background: transparent; color: var(--ink); border: 2px solid var(--td); }
  .team-btn:disabled { background: var(--line); color: var(--muted); cursor: default; }

  /* ---------- Team screen ---------- */
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 20px 0; }
  .slot { position: relative; border-radius: 22px; min-height: 168px; }
  .slot.filled { background: color-mix(in srgb, var(--t) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--t) 30%, var(--line)); }
  .slot-main { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; height: 100%; padding: 14px; border-radius: 22px; }
  .slot-main .num { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
  .slot-main .art { align-self: center; margin: 2px 0 4px; }
  .slot-main h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .slot-x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; font-size: 22px; line-height: 1; background: color-mix(in srgb, var(--ink) 10%, transparent); display: grid; place-items: center; }
  .empty-slot { border: 2px dashed var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-weight: 500; font-size: 14px; }
  .empty-slot .plus { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--ink); }
  .team-sec { padding: 28px 20px 0; }
  .team-sec h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
  .team-sec .note { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .cover { width: 100%; border-collapse: collapse; font-size: 14px; }
  .cover th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .cover td { padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .cover .flag { color: var(--bad); font-weight: 600; font-size: 13px; }
  .cover tr.bad .w { color: var(--bad); font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .clear-btn { margin: 26px 20px 28px; height: 46px; padding: 0 20px; border-radius: 16px; border: 1px solid var(--rule); font-weight: 600; }
  .tip { margin: 16px 20px 0; font-size: 13px; color: var(--muted); }

  /* ---------- Picker sheet ---------- */
  .picker { position: absolute; inset: 0; z-index: 30; }
  .scrim { position: absolute; inset: 0; background: rgba(11, 20, 23, .5); }
  .picker-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 80%; background: var(--bg); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .4s cubic-bezier(.22,1,.36,1); will-change: transform; }
  .picker { visibility: hidden; pointer-events: none; transition: visibility 0s .4s; }
  .picker.open { visibility: visible; pointer-events: auto; transition: visibility 0s; }
  .picker .scrim { opacity: 0; transition: opacity .35s ease; }
  .picker.open .scrim { opacity: 1; }
  .picker.open .picker-sheet { transform: none; }
  .picker-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
  .picker-head h3 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .picker-sheet .search { margin: 14px 20px 0; }
  .pick-list { list-style: none; margin: 12px 0 0; padding: 0 20px 24px; overflow-y: auto; display: grid; gap: 8px; }
  .pick-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; text-align: left; background: color-mix(in srgb, var(--t) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--t) 28%, var(--line)); }
  .pick-row:disabled { opacity: .6; cursor: default; }
  .pk-name { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .pk-top { display: flex; align-items: baseline; gap: 8px; }
  .pk-top b { font-family: var(--display); font-size: 16px; }
  .pk-top small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pk-act { font-weight: 600; font-size: 13.5px; padding: 7px 13px; border-radius: 15px; background: var(--td); color: #fff; }
  .pick-row:disabled .pk-act { background: transparent; color: var(--muted); }

  /* ---------- Motion ---------- */
  /* Switching tabs: the new screen slides in from the side the tab sits on */
  .enter-r { animation: enterR .4s cubic-bezier(.22,1,.36,1); }
  .enter-l { animation: enterL .4s cubic-bezier(.22,1,.36,1); }
  @keyframes enterR { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes enterL { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }

  /* Opening a Pokémon: the screen underneath slides back and dims, then returns when you close */
  #listScreen, #teamScreen { transition: transform .34s cubic-bezier(.22,1,.36,1), opacity .34s ease; }
  .device.detail-open #listScreen, .device.detail-open #teamScreen { transform: translateX(-22%); opacity: .5; }

  /* Detail entrance: the ball rolls in, the name rises, the sheet slides up */
  .detail.open .big-art { animation: artIn .65s .1s cubic-bezier(.3,1.25,.5,1) both; }
  .detail.open .hero h2, .detail.open .hero .dexnum { animation: riseIn .45s .12s cubic-bezier(.22,1,.36,1) both; }
  .detail.open .sheet { animation: sheetRise .5s .08s cubic-bezier(.22,1,.36,1) both; }
  @keyframes artIn { from { opacity: 0; transform: translateX(70px) rotate(-140deg) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes sheetRise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: none; } }

  /* Adding to the team: the new slot pops in once the sheet has closed */
  .slot.pop { animation: slotPop .5s .3s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes slotPop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }

  /* ---------- Sorting ---------- */
  .sortrow { display: flex; gap: 8px; padding: 12px 20px 0; align-items: center; }
  .seg { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--field); border: 1px solid var(--line); border-radius: 14px; }
  .seg button { height: 36px; border-radius: 11px; font-weight: 600; font-size: 13.5px; color: var(--muted); transition: background .2s ease, color .2s ease; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .icon-btn.dir { border-radius: 14px; flex: none; }
  .dir svg { transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
  .dir.desc svg { transform: rotate(180deg); }

  /* ---------- Detail: shiny and type matchups ---------- */
  .bar-right { display: flex; gap: 8px; }
  .hero .icon-btn[aria-pressed="true"]#shinyBtn { background: rgba(255,255,255,.34); }
  .big-art svg.shiny { filter: hue-rotate(155deg) saturate(1.35) brightness(1.06); }
  .big-art svg.swap { animation: swapIn .5s cubic-bezier(.3,1.4,.5,1); }
  @keyframes swapIn { from { transform: scale(.7) rotate(-30deg); opacity: .4; } to { transform: none; opacity: 1; } }
  .spark { transform-box: fill-box; transform-origin: center; animation: twinkle .7s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes twinkle { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .match-group + .match-group { margin-top: 14px; }
  .match-label { margin: 0 0 6px; font-size: 13.5px; color: var(--muted); }
  .match-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .match-pills .pill { height: 28px; padding: 0 11px; font-size: 13px; }
  .pill em { font-style: normal; font-weight: 700; margin-left: 2px; }
  .none { font-size: 14px; color: var(--muted); }

  /* ---------- Loading skeletons ---------- */
  .sk { display: block; border-radius: 10px; background: linear-gradient(90deg, var(--line) 0%, color-mix(in srgb, var(--line) 45%, var(--bg)) 50%, var(--line) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .sk-card { --t: #9fb0ad; pointer-events: none; }
  .sk-card .sk-num { width: 34px; height: 12px; }
  .sk-card .sk-ball { width: 78px; height: 78px; border-radius: 50%; align-self: center; margin: 2px 0 4px; }
  .sk-card .sk-name { width: 70%; height: 18px; }
  .sk-card .sk-pill { width: 56px; height: 24px; border-radius: 12px; }
  .sk-evo { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .sk-node { flex: none; width: 70px; height: 92px; border-radius: 18px; }
  .sk-edge { flex: none; width: 34px; height: 10px; }
  .sk-stat { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: center; margin-top: 11px; }
  .sk-stat .sk-l { width: 48px; height: 12px; }
  .sk-stat .sk-b { height: 9px; border-radius: 5px; }
  .sk-pills { display: flex; gap: 6px; margin-top: 6px; }
  .sk-pills .sk { width: 76px; height: 28px; border-radius: 14px; }
  .sk-label { width: 70px; height: 12px; margin-top: 14px; }

  /* ---------- Detail: About ---------- */
  .about { animation: fadeText .3s ease both; }
  @keyframes fadeText { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .genus { margin: 0 0 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 600; font-size: 15px; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--t) 24%, var(--surface)); }
  .desc { margin: 0 0 16px; line-height: 1.5; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
  .facts > div { padding: 10px 12px; border-radius: 16px; background: var(--field); border: 1px solid var(--line); }
  .facts dt { font-size: 12.5px; color: var(--muted); }
  .facts dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .abil { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
  .abil > span:first-child { font-size: 13.5px; color: var(--muted); margin-right: 2px; }
  .ab-chip { padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 500; background: var(--field); border: 1px solid var(--line); }
  .ab-chip em { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 4px; }
  .from { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  .linkbtn { font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; padding: 8px 2px; }

  /* ---------- Haptics cue (draft only: shows where a phone would buzz) ---------- */
  .haptic-cue { position: absolute; top: 12px; left: 50%; translate: -50% 0; z-index: 70; padding: 7px 14px; border-radius: 16px; background: #13222b; color: #fff; font-size: 12.5px; font-weight: 600; opacity: 0; transform: translateY(-8px); transition: opacity .2s ease, transform .2s ease; pointer-events: none; white-space: nowrap; }
  .haptic-cue.show { opacity: .95; transform: none; }

  /* ---------- Launch animation ---------- */
  .splash { position: absolute; inset: 0; z-index: 60; background: #13222b; display: grid; place-items: center; }
  .splash[hidden] { display: none; }
  .splash .stage { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
  .splash .glow { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 68%); opacity: 0; }
  .splash .drop, .splash .rot { width: 150px; height: 150px; }
  .splash svg { display: block; overflow: visible; }
  .splash svg .lid, .splash svg .base { transform-box: view-box; transform-origin: 50px 50px; }
  .splash .word { position: absolute; left: 50%; top: 50%; translate: -50% -50%; white-space: nowrap; color: #fff; font-family: var(--display); font-weight: 800; font-size: 48px; letter-spacing: -0.03em; opacity: 0; }
  .splash.play { animation: splashOut .4s 2s ease both; }
  .splash.play .drop { animation: ballDrop .45s cubic-bezier(.3,1.4,.5,1) both; }
  .splash.play .rot { animation: ballWobble .6s .45s ease-in-out both; }
  .splash.play .lid { animation: lidOpen .4s 1.05s cubic-bezier(.5,0,.2,1) both; }
  .splash.play .base { animation: baseOpen .4s 1.05s cubic-bezier(.5,0,.2,1) both; }
  .splash.play .belt, .splash.play .btn { animation: fadeAway .15s 1.05s ease both; }
  .splash.play .glow { animation: burst .55s 1.05s ease-out both; }
  .splash.play .word { animation: wordIn .5s 1.2s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes ballDrop { from { transform: translateY(-130px) scale(.7); opacity: 0; } 50% { opacity: 1; } to { transform: none; opacity: 1; } }
  @keyframes ballWobble { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 45% { transform: rotate(12deg); } 70% { transform: rotate(-6deg); } 85% { transform: rotate(3deg); } }
  @keyframes lidOpen { to { transform: translateY(-34px) rotate(-20deg); opacity: 0; } }
  @keyframes baseOpen { to { transform: translateY(30px) rotate(6deg); opacity: 0; } }
  @keyframes fadeAway { to { opacity: 0; } }
  @keyframes burst { 0% { transform: scale(.3); opacity: .95; } 100% { transform: scale(3.2); opacity: 0; } }
  @keyframes wordIn { from { opacity: 0; transform: scale(.9); letter-spacing: .08em; } to { opacity: 1; transform: none; letter-spacing: -0.03em; } }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; } }

  @media (prefers-reduced-motion: reduce) {
    .detail, .fill, .card { transition: none; }
    .splash { display: none; }
    .picker-sheet, .picker .scrim, #listScreen, #teamScreen, .tab-ind, .tab svg { transition: none; }
    .sk, .spark, .big-art svg.swap, .dir svg, .haptic-cue, .about { animation: none; transition: none; }
    .enter-r, .enter-l, .detail.open .big-art, .detail.open .hero h2, .detail.open .hero .dexnum, .detail.open .sheet, .slot.pop { animation: none; }
  }
</style>
</head>
<body>
<div class="device" id="device">
  <main class="scroll" id="listScreen">
    <header class="top">
      <div>
        <h1>Pokédex</h1>
        <p class="sub">Find a Pokémon, then follow its evolutions.</p>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch between light and dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by name or number" aria-label="Search Pokémon" autocomplete="off">
    </div>

    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
    <div class="sortrow">
      <div class="seg" id="seg" role="group" aria-label="Sort by">
        <button data-sort="num" aria-pressed="true">Number</button>
        <button data-sort="name" aria-pressed="false">Name</button>
        <button data-sort="power" aria-pressed="false">Power</button>
      </div>
      <button class="icon-btn dir" id="dirBtn" aria-label="Sorted low to high. Tap to reverse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div id="grid"></div>
  </main>

  <main class="scroll" id="teamScreen" hidden>
    <header class="top">
      <div>
        <h1>My team</h1>
        <p class="sub" id="teamSub">Pick up to 6 Pokémon and see how well they cover each other.</p>
      </div>
    </header>
    <div id="teamBody"></div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <span class="tab-ind" id="tabInd"></span>
    <button class="tab" data-tab="dex" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
      Pokédex
    </button>
    <button class="tab" data-tab="team">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/></svg>
      Team
    </button>
    <button class="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-8-4.7-8-10.6A4.4 4.4 0 0 1 12 7.5a4.4 4.4 0 0 1 8 2.4c0 5.9-8 10.6-8 10.6z"/></svg>
      Saved
    </button>
  </nav>

  <section class="detail" id="detail" aria-label="Pokémon details"></section>

  <div class="picker" id="picker">
    <div class="scrim" data-close></div>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-label="Add a Pokémon to your team">
      <div class="picker-head">
        <h3>Add to team</h3>
        <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="pq" type="search" placeholder="Search by name or number" aria-label="Search Pokémon to add" autocomplete="off">
      </div>
      <ul class="pick-list" id="pickList"></ul>
    </div>
  </div>

  <div class="haptic-cue" id="hcue" aria-hidden="true"></div>

  <div class="splash play" id="splash" aria-hidden="true">
    <div class="stage">
      <div class="glow"></div>
      <div class="drop"><div class="rot">
        <svg viewBox="0 0 100 100" width="150" height="150">
          <path class="lid" d="M4 50a46 46 0 0 1 92 0z" fill="#e8453c"/>
          <path class="base" d="M4 50a46 46 0 0 0 92 0z" fill="#f4f7f6"/>
          <rect class="belt" x="4" y="46" width="92" height="8" fill="#0b1417"/>
          <circle class="btn" cx="50" cy="50" r="14" fill="#f4f7f6" stroke="#0b1417" stroke-width="6"/>
        </svg>
      </div></div>
      <div class="word">Pokédex</div>
    </div>
  </div>
</div>

<script>
(function () {
  var TYPES = {
    grass:    { c: '#4caf6a', d: '#2f7d4a', n: 'Grass' },
    poison:   { c: '#9b59b6', d: '#6f3a86', n: 'Poison' },
    fire:     { c: '#ee6b3a', d: '#b8431a', n: 'Fire' },
    flying:   { c: '#7b9de0', d: '#4a6cb8', n: 'Flying' },
    water:    { c: '#3b8fe0', d: '#1f68b8', n: 'Water' },
    electric: { c: '#f2c230', d: '#8a6500', n: 'Electric' },
    normal:   { c: '#9a9a8a', d: '#636355', n: 'Normal' },
    psychic:  { c: '#e85d8f', d: '#b32f66', n: 'Psychic' },
    dark:     { c: '#6a5a55', d: '#3d3431', n: 'Dark' }
  };
  var STAT_NAMES = ['HP', 'Attack', 'Defense', 'Sp. Atk', 'Sp. Def', 'Speed'];

  // Sample data for the design draft. The real app will load this from PokéAPI.
  var POKE = [
    { id: 1,   k: 'bulbasaur',  name: 'Bulbasaur',  types: ['grass', 'poison'], s: [45, 49, 49, 65, 65, 45] },
    { id: 2,   k: 'ivysaur',    name: 'Ivysaur',    types: ['grass', 'poison'], s: [60, 62, 63, 80, 80, 60] },
    { id: 3,   k: 'venusaur',   name: 'Venusaur',   types: ['grass', 'poison'], s: [80, 82, 83, 100, 100, 80] },
    { id: 4,   k: 'charmander', name: 'Charmander', types: ['fire'],            s: [39, 52, 43, 60, 50, 65] },
    { id: 5,   k: 'charmeleon', name: 'Charmeleon', types: ['fire'],            s: [58, 64, 58, 80, 65, 80] },
    { id: 6,   k: 'charizard',  name: 'Charizard',  types: ['fire', 'flying'],  s: [78, 84, 78, 109, 85, 100] },
    { id: 7,   k: 'squirtle',   name: 'Squirtle',   types: ['water'],           s: [44, 48, 65, 50, 64, 43] },
    { id: 8,   k: 'wartortle',  name: 'Wartortle',  types: ['water'],           s: [59, 63, 80, 65, 80, 58] },
    { id: 9,   k: 'blastoise',  name: 'Blastoise',  types: ['water'],           s: [79, 83, 100, 85, 105, 78] },
    { id: 25,  k: 'pikachu',    name: 'Pikachu',    types: ['electric'],        s: [35, 55, 40, 50, 50, 90] },
    { id: 26,  k: 'raichu',     name: 'Raichu',     types: ['electric'],        s: [60, 90, 55, 90, 80, 110] },
    { id: 133, k: 'eevee',      name: 'Eevee',      types: ['normal'],          s: [55, 55, 50, 45, 65, 55] },
    { id: 134, k: 'vaporeon',   name: 'Vaporeon',   types: ['water'],           s: [130, 65, 60, 110, 95, 65] },
    { id: 135, k: 'jolteon',    name: 'Jolteon',    types: ['electric'],        s: [65, 65, 60, 110, 95, 130] },
    { id: 136, k: 'flareon',    name: 'Flareon',    types: ['fire'],            s: [65, 130, 60, 95, 110, 65] },
    { id: 172, k: 'pichu',      name: 'Pichu',      types: ['electric'],        s: [20, 40, 15, 35, 35, 60] },
    { id: 196, k: 'espeon',     name: 'Espeon',     types: ['psychic'],         s: [65, 65, 60, 130, 95, 110] },
    { id: 197, k: 'umbreon',    name: 'Umbreon',    types: ['dark'],            s: [95, 65, 110, 60, 130, 65] }
  ];
  var BY = {}, BYID = {};
  POKE.forEach(function (p) { BY[p.k] = p; BYID[p.id] = p; });

  function n(k, via, kids) { return { k: k, via: via || '', kids: kids || [] }; }
  var CHAINS = [
    n('bulbasaur', '', [n('ivysaur', 'Level 16', [n('venusaur', 'Level 32')])]),
    n('charmander', '', [n('charmeleon', 'Level 16', [n('charizard', 'Level 36')])]),
    n('squirtle', '', [n('wartortle', 'Level 16', [n('blastoise', 'Level 36')])]),
    n('pichu', '', [n('pikachu', 'Friendship', [n('raichu', 'Thunder Stone')])]),
    n('eevee', '', [
      n('vaporeon', 'Water Stone'),
      n('jolteon', 'Thunder Stone'),
      n('flareon', 'Fire Stone'),
      n('espeon', 'Friendship, daytime'),
      n('umbreon', 'Friendship, night')
    ])
  ];
  function contains(node, k) {
    if (node.k === k) return true;
    return node.kids.some(function (c) { return contains(c, k); });
  }
  function chainFor(k) { return CHAINS.filter(function (c) { return contains(c, k); })[0]; }
  function depth(node) { return 1 + Math.max(0, Math.max.apply(null, node.kids.map(depth).concat([0]))); }
  function size(node) { return 1 + node.kids.reduce(function (a, c) { return a + size(c); }, 0); }

  var state = { tab: 'dex', q: '', type: 'all', detail: null, favs: {}, team: [], sort: 'num', asc: true, loading: false, shiny: false };
  try { state.favs = JSON.parse(localStorage.getItem('dex-favs') || '{}') || {}; } catch (e) { state.favs = {}; }
  function saveFavs() { try { localStorage.setItem('dex-favs', JSON.stringify(state.favs)); } catch (e) {} }
  try { state.team = JSON.parse(localStorage.getItem('dex-team') || '[]') || []; } catch (e) { state.team = []; }
  state.team = state.team.filter(function (id) { return BYID[id]; }).slice(0, 6);
  function saveTeam() { try { localStorage.setItem('dex-team', JSON.stringify(state.team)); } catch (e) {} }

  function pad(id) { return String(id).padStart(3, '0'); }
  function theme(p) { var t = TYPES[p.types[0]]; return '--t:' + t.c + ';--td:' + t.d + ';'; }

  // Placeholder artwork: a Poké Ball tinted by the Pokémon’s types.
  function art(p, s, shiny) {
    var top = TYPES[p.types[0]].c;
    var bottom = p.types[1] ? TYPES[p.types[1]].c : '#ffffff';
    return '<svg class="' + (shiny ? 'shiny' : '') + '" viewBox="0 0 100 100" width="' + s + '" height="' + s + '" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="46" fill="' + top + '"/>' +
      '<path d="M4 50a46 46 0 0 0 92 0z" fill="' + bottom + '" opacity="' + (p.types[1] ? '.9' : '.92') + '"/>' +
      '<rect x="4" y="46" width="92" height="8" fill="#13222b" opacity=".85"/>' +
      '<circle cx="50" cy="50" r="14" fill="#fff" stroke="#13222b" stroke-width="6"/>' + (shiny ? SPARKS : '') + '</svg>';
  }
  var HEART = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-8-4.7-8-10.6A4.4 4.4 0 0 1 12 7.5a4.4 4.4 0 0 1 8 2.4c0 5.9-8 10.6-8 10.6z"/></svg>';
  var HEART_LINE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-8-4.7-8-10.6A4.4 4.4 0 0 1 12 7.5a4.4 4.4 0 0 1 8 2.4c0 5.9-8 10.6-8 10.6z"/></svg>';

  /* ---------- List ---------- */
  var chipsEl = document.getElementById('chips');
  function renderChips() {
    var html = '<button class="chip" data-all data-type="all" aria-pressed="' + (state.type === 'all') + '">All</button>';
    Object.keys(TYPES).forEach(function (t) {
      html += '<button class="chip" data-type="' + t + '" style="--t:' + TYPES[t].c + ';--td:' + TYPES[t].d + '" aria-pressed="' + (state.type === t) + '"><i></i>' + TYPES[t].n + '</button>';
    });
    chipsEl.innerHTML = html;
  }

  function visible() {
    var q = state.q.trim().toLowerCase().replace('#', '');
    return POKE.filter(function (p) {
      if (state.tab === 'saved' && !state.favs[p.id]) return false;
      if (state.type !== 'all' && p.types.indexOf(state.type) < 0) return false;
      if (!q) return true;
      return p.name.toLowerCase().indexOf(q) >= 0 || String(p.id) === q || pad(p.id).indexOf(q) >= 0;
    });
  }

  function pills(p) {
    return '<div class="pills">' + p.types.map(function (t) {
      return '<span class="pill" style="--t:' + TYPES[t].c + '"><i></i>' + TYPES[t].n + '</span>';
    }).join('') + '</div>';
  }

  function renderGrid() {
    var list = sortList(visible());
    var countEl = document.getElementById('count');
    var grid = document.getElementById('grid');
    if (state.loading) {
      countEl.textContent = 'Loading Pokémon…';
      grid.innerHTML = '<div class="grid" aria-busy="true">' + [0, 1, 2, 3, 4, 5].map(function () {
        return '<div class="card sk-card"><span class="sk sk-num"></span><span class="sk sk-ball"></span><span class="sk sk-name"></span><span class="sk sk-pill"></span></div>';
      }).join('') + '</div>';
      return;
    }
    countEl.textContent = list.length + (list.length === 1 ? ' Pokémon' : ' Pokémon') + (state.tab === 'saved' ? ' saved' : '');
    if (!list.length) {
      var msg = state.tab === 'saved' && !state.q && state.type === 'all'
        ? '<strong>No saved Pokémon yet</strong>Open a Pokémon and tap the heart to keep it here.'
        : '<strong>Nothing matches</strong>Try another name, or clear the type filter.';
      grid.innerHTML = '<div class="empty">' + msg + '</div>';
      return;
    }
    grid.innerHTML = '<div class="grid">' + list.map(function (p) {
      return '<button class="card" data-open="' + p.id + '" style="' + theme(p) + '" aria-label="' + p.name + ', number ' + p.id + '">' +
        (state.favs[p.id] ? '<span class="fav">' + HEART + '</span>' : '') +
        '<span class="num">#' + pad(p.id) + '</span>' +
        '<span class="art">' + art(p, 78) + '</span>' +
        '<h3>' + p.name + '</h3>' + pills(p) + '</button>';
    }).join('') + '</div>';
  }

  /* ---------- Detail ---------- */
  var detailEl = document.getElementById('detail');

  function evoNode(node, current) {
    var p = BY[node.k];
    var html = '<div class="evo-row"><button class="evo-node' + (node.k === current ? ' is-current' : '') + '" data-open="' + p.id + '" style="' + theme(p) + '" aria-label="' + p.name + (node.k === current ? ' (current)' : '') + '">' +
      art(p, 40) + '<span>' + p.name + '</span><small>#' + pad(p.id) + '</small></button>';
    if (node.kids.length) {
      html += '<div class="evo-kids' + (node.kids.length > 1 ? ' multi' : '') + '">' +
        node.kids.map(function (kid) {
          return '<div class="evo-kid"><div class="evo-edge"><span>' + kid.via + '</span></div>' + evoNode(kid, current) + '</div>';
        }).join('') + '</div>';
    }
    return html + '</div>';
  }

  function renderDetail(id, keepScroll) {
    var p = BYID[id];
    var chain = chainFor(p.k);
    var total = p.s.reduce(function (a, b) { return a + b; }, 0);
    var branches = chain.kids.length > 1;
    var note = branches
      ? p.name + ' can become ' + chain.kids.length + ' different Pokémon.'
      : depth(chain) + ' stages. Tap any Pokémon to open it.';
    if (branches && chain.k !== p.k) note = 'Part of the Eevee family. Tap any Pokémon to open it.';
    if (branches && chain.k === p.k) note += ' Tap one to open it.';

    detailEl.setAttribute('style', theme(p));
    detailEl.innerHTML =
      '<div class="hero">' +
        '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="6"/><line x1="4" y1="50" x2="96" y2="50" stroke="#fff" stroke-width="8"/><circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-width="6"/></svg>' +
        '<div class="bar">' +
          '<button class="icon-btn" id="backBtn" aria-label="Back to list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
          '<button class="icon-btn" id="favBtn" aria-pressed="' + !!state.favs[p.id] + '" aria-label="' + (state.favs[p.id] ? 'Remove from saved' : 'Save Pokémon') + '">' + (state.favs[p.id] ? HEART : HEART_LINE) + '</button>' +
        '</div>' +
        '<h2>' + p.name + '</h2>' +
        '<div class="dexnum">#' + pad(p.id) + '</div>' +
        '<div style="margin-top:12px;position:relative;z-index:2">' + pills(p) + '</div>' +
        '<div class="big-art">' + art(p, 132) + '</div>' +
      '</div>' +
      '<div class="sheet">' + teamBtnHtml(p) +
        '<section><h3>Evolution chain</h3><p class="note">' + note + '</p>' +
          '<div class="evo-wrap">' + evoNode(chain, p.k) + '</div></section>' +
        '<section><h3>Base stats</h3>' +
          '<ul class="stats" style="--t:' + TYPES[p.types[0]].c + '">' +
          p.s.map(function (v, i) {
            return '<li class="stat"><span>' + STAT_NAMES[i] + '</span><b>' + v + '</b><div class="track"><div class="fill" data-w="' + Math.min(100, Math.round(v / 150 * 100)) + '"></div></div></li>';
          }).join('') + '</ul>' +
          '<div class="total"><span>Total</span><b>' + total + '</b></div></section>' +
      '</div>';

    enhanceDetail(p);
    if (!keepScroll) detailEl.scrollTop = 0;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        detailEl.querySelectorAll('.fill').forEach(function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
      });
    });
  }

  function openDetail(id) {
    state.detail = id;
    renderDetail(id, false);
    detailEl.classList.add('open');
    document.getElementById('device').classList.add('detail-open');
    haptic('light');
    var b = document.getElementById('backBtn'); if (b) b.focus({ preventScroll: true });
  }
  function closeDetail() {
    state.detail = null;
    detailEl.classList.remove('open');

    right.className = 'bar-right';
    var sb = document.createElement('button');
    sb.className = 'icon-btn'; sb.id = 'shinyBtn';
    sb.setAttribute('aria-pressed', 'false');
    sb.setAttribute('aria-label', 'Show shiny colors');
    sb.innerHTML = SPARKLE;
    bar.appendChild(right); right.appendChild(sb); right.appendChild(fav);

    // Type matchups go after the stats
    var secs = detailEl.querySelectorAll('.sheet > section');
    var evo = secs[0], stats = secs[1];
    evo.parentNode.insertBefore(aboutSection(p), evo);
    var match = document.createElement('section');
    var matchHtml = '<h3>Type matchups</h3><p class="note">How much damage each attack type does to ' + p.name + '.</p>' + matchupsHtml(p);
    match.innerHTML = matchHtml;
    stats.parentNode.insertBefore(match, stats.nextSibling);

    return; // Draft: no artificial delay. The skeleton code below is kept as reference for the app.
    var evoHtml = evo.innerHTML, statsHtml = stats.innerHTML;
    evo.innerHTML = '<h3>Evolution chain</h3>' + skEvo();
    stats.innerHTML = '<h3>Base stats</h3>' + skStats();
    match.innerHTML = '<h3>Type matchups</h3>' + skMatch();
    setTimeout(function () {
      if (token !== detailToken) return;
      stats.innerHTML = statsHtml;
      match.innerHTML = matchHtml;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          stats.querySelectorAll('.fill').forEach(function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
        });
      });
    }, 700);
    setTimeout(function () {
      if (token !== detailToken) return;
      evo.innerHTML = evoHtml;
      seen[p.id] = true;
    }, 1200);
  }
  syncSort();

  /* ---------- Launch animation ---------- */
  var splash = document.getElementById('splash');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var splashDone = false;
  function endSplash() {
    splash.hidden = true;
    if (splashDone) return;
    splashDone = true;
    // Draft: no artificial wait. The real app shows skeletons only while a request is actually pending.
    state.loading = false;
  }
  splash.addEventListener('animationend', function (e) {
    if (e.target === splash && e.animationName === 'splashOut') endSplash();
  });
  splash.addEventListener('click', endSplash);
  // Plays once per launch, when the page loads. Switching tabs or returning to the app never replays it.
  if (reduceMotion) endSplash();

  renderChips();
  renderGrid();
})();
</script>
</body>
</html>
